<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Угадай первый и последний звук — Краинская И. А.</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: 'Comic Sans MS', 'Arial Rounded MT Bold', 'Segoe UI', sans-serif;
    background-color: #e0f7fa;
    margin: 0;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    touch-action: pan-y;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 540px;
    margin-bottom: 8px;
    gap: 8px;
  }
  h1 {
    color: #006064;
    font-size: 20px;
    margin: 0;
    line-height: 1.2;
  }
  .sound-btn {
    background-color: #ffffff;
    border: 2px solid #00838f;
    color: #006064;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    padding: 14px 16px;
    width: 100%;
    max-width: 540px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .nav-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .nav-arrow {
    background-color: #e0f7fa;
    border: 2px solid #00838f;
    color: #006064;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .nav-arrow:active {
    background-color: #b2ebf2;
  }
  .progress {
    font-size: 15px;
    font-weight: bold;
    color: #006064;
    background: #e0f7fa;
    padding: 5px 14px;
    border-radius: 15px;
  }
  .game-area {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    margin: 8px 0;
  }
  .picture {
    font-size: 95px;
    line-height: 1;
    filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15));
  }
  .slots {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .slot-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .slot-label {
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-bottom: 4px;
  }
  .drop-zone {
    width: 68px;
    height: 68px;
    border: 3px dashed #00838f;
    border-radius: 14px;
    background-color: #f1f8e9;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 36px;
    font-weight: bold;
    transition: background-color 0.3s, border-color 0.3s;
  }
  .drop-zone.correct {
    border: 3px solid #2e7d32;
    background-color: #c8e6c9;
    color: #1b5e20;
  }
  .drop-zone.wrong {
    border: 3px solid #c62828;
    background-color: #ffcdd2;
    animation: shake 0.4s;
  }
  .action-area {
    width: 100%;
    margin-top: 10px;
  }
  .letters-pool {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    background-color: #fff3e0;
    border-radius: 15px;
    width: 100%;
    min-height: 82px;
  }
  .letter {
    width: 58px;
    height: 58px;
    background-color: #ffb74d;
    color: #fff;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 32px;
    font-weight: bold;
    box-shadow: 0 4px 0 #f57c00;
    cursor: grab;
    touch-action: none;
  }
  .letter.dragging {
    position: fixed;
    z-index: 1000;
    opacity: 0.95;
    transform: scale(1.15);
    pointer-events: none;
  }
  .win-box {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #e8f5e9;
    border: 2px solid #4caf50;
    border-radius: 15px;
    padding: 12px;
    width: 100%;
    text-align: center;
  }
  .message {
    font-size: 19px;
    font-weight: bold;
    color: #2e7d32;
    margin-bottom: 10px;
  }
  .btn-next {
    padding: 10px 28px;
    font-size: 19px;
    font-weight: bold;
    color: #fff;
    background-color: #00838f;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    box-shadow: 0 4px 0 #005662;
  }
  .btn-next:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #005662;
  }
  .author-box {
    background: rgba(255, 255, 255, 0.85);
    border-left: 4px solid #00838f;
    border-radius: 10px;
    padding: 8px 12px;
    margin-top: 10px;
    width: 100%;
    max-width: 540px;
    font-size: 12px;
    color: #37474f;
    line-height: 1.35;
  }
  .author-box strong {
    color: #006064;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }
  @media (max-width: 480px) {
    h1 { font-size: 17px; }
    .picture { font-size: 80px; }
    .drop-zone { width: 60px; height: 60px; font-size: 32px; }
    .letter { width: 52px; height: 52px; font-size: 28px; }
  }
</style>
</head>
<body>

<div class="header-bar">
  <h1>Угадай первый и последний звук</h1>
  <button class="sound-btn" id="sound-toggle" onclick="toggleSound()">🔊 Звук вкл</button>
</div>

<div class="card">
  <div class="nav-bar">
    <button class="nav-arrow" onclick="prevCard()" title="Предыдущая карточка">◀</button>
    <div class="progress" id="progress">Карточка 1 из 10</div>
    <button class="nav-arrow" onclick="nextCard()" title="Следующая карточка">▶</button>
  </div>
  
  <div class="game-area">
    <div class="picture" id="picture">🍄</div>
    
    <div class="slots">
      <div class="slot-group">
        <div class="slot-label">первый звук</div>
        <div class="drop-zone" id="first-slot" data-target=""></div>
      </div>
      <div class="slot-group">
        <div class="slot-label">последний звук</div>
        <div class="drop-zone" id="last-slot" data-target=""></div>
      </div>
    </div>
  </div>

  <div class="action-area">
    <div class="letters-pool" id="letters-pool"></div>
    <div class="win-box" id="win-box">
      <div class="message" id="message"></div>
      <button class="btn-next" id="btn-next" onclick="nextCard()">Дальше ➔</button>
    </div>
  </div>
</div>

<div class="author-box">
  <div><strong>Автор-составитель:</strong> Краинская Ирина Александровна, педагог дополнительного образования</div>
  <div><strong>Учреждение:</strong> Муниципальное бюджетное образовательное учреждение дополнительного образования «Дом детского творчества» пгт Сосьва</div>
</div>

<script>
  const cards = [
    { word: "ГРИБ", emoji: "🍄", first: "Г", last: "Б", extras: ["П", "К", "Р"] },
    { word: "МЯЧ", emoji: "⚽", first: "М", last: "Ч", extras: ["Щ", "Н", "Ш"] },
    { word: "РАКЕТА", emoji: "🚀", first: "Р", last: "А", extras: ["Л", "О", "К"] },
    { word: "ВЕРТОЛЁТ", emoji: "🚁", first: "В", last: "Т", extras: ["Д", "Ф", "Л"] },
    { word: "ВЕДРО", emoji: "🪣", first: "В", last: "О", extras: ["А", "Ф", "Р"] },
    { word: "ПОМИДОР", emoji: "🍅", first: "П", last: "Р", extras: ["Б", "Л", "М"] },
    { word: "ЗАЯЦ", emoji: "🐰", first: "З", last: "Ц", extras: ["С", "Ч", "Щ"] },
    { word: "ПЕТУХ", emoji: "🐓", first: "П", last: "Х", extras: ["Б", "К", "Ш"] },
    { word: "ШАР", emoji: "🎈", first: "Ш", last: "Р", extras: ["Ж", "Л", "Щ"] },
    { word: "ЧАШКА", emoji: "☕", first: "Ч", last: "А", extras: ["Щ", "О", "Ш"] }
  ];

  let currentIndex = 0;
  let solvedCount = 0;
  let soundEnabled = true;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (AudioContext) audioCtx = new AudioContext();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, delay = 0) {
    if (!soundEnabled) return;
    initAudio();
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(audioCtx.currentTime + delay);
    osc.stop(audioCtx.currentTime + delay + duration);
  }

  function playGrab() { playTone(440, 'sine', 0.08); }
  function playCorrect() {
    playTone(523.25, 'sine', 0.15, 0);
    playTone(659.25, 'sine', 0.25, 0.1);
  }
  function playWin() {
    playTone(523.25, 'triangle', 0.15, 0);
    playTone(659.25, 'triangle', 0.15, 0.12);
    playTone(783.99, 'triangle', 0.15, 0.24);
    playTone(1046.50, 'triangle', 0.35, 0.36);
  }
  function playWrong() {
    playTone(200, 'sawtooth', 0.18, 0);
    playTone(160, 'sawtooth', 0.22, 0.12);
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('sound-toggle');
    btn.textContent = soundEnabled ? '🔊 Звук вкл' : '🔇 Звук выкл';
    if (soundEnabled) playGrab();
  }

  function loadCard(index) {
    const card = cards[index];
    solvedCount = 0;
    
    document.getElementById('progress').textContent = `Карточка ${index + 1} из ${cards.length}`;
    document.getElementById('picture').textContent = card.emoji;
    
    const pool = document.getElementById('letters-pool');
    const winBox = document.getElementById('win-box');
    pool.style.display = 'flex';
    winBox.style.display = 'none';

    const firstSlot = document.getElementById('first-slot');
    const lastSlot = document.getElementById('last-slot');
    
    firstSlot.textContent = '';
    firstSlot.dataset.target = card.first;
    firstSlot.className = 'drop-zone';

    lastSlot.textContent = '';
    lastSlot.dataset.target = card.last;
    lastSlot.className = 'drop-zone';

    pool.innerHTML = '';

    let letters = [card.first, card.last, ...card.extras];
    letters.sort(() => Math.random() - 0.5);

    letters.forEach(char => {
      const el = document.createElement('div');
      el.className = 'letter';
      el.textContent = char;
      el.dataset.char = char;
      setupDrag(el);
      pool.appendChild(el);
    });
  }

  function setupDrag(el) {
    let startX, startY;

    el.addEventListener('pointerdown', (e) => {
      if (el.classList.contains('used')) return;
      e.preventDefault();
      playGrab();
      el.setPointerCapture(e.pointerId);
      
      const rect = el.getBoundingClientRect();
      startX = e.clientX - rect.left;
      startY = e.clientY - rect.top;

      el.classList.add('dragging');
      el.style.left = (e.clientX - startX) + 'px';
      el.style.top = (e.clientY - startY) + 'px';
    });

    el.addEventListener('pointermove', (e) => {
      if (!el.classList.contains('dragging')) return;
      el.style.left = (e.clientX - startX) + 'px';
      el.style.top = (e.clientY - startY) + 'px';
    });

    el.addEventListener('pointerup', (e) => {
      if (!el.classList.contains('dragging')) return;
      el.classList.remove('dragging');
      el.style.left = '';
      el.style.top = '';

      const dropZones = document.querySelectorAll('.drop-zone');
      dropZones.forEach(zone => {
        const rect = zone.getBoundingClientRect();
        if (
          e.clientX >= rect.left - 10 &&
          e.clientX <= rect.right + 10 &&
          e.clientY >= rect.top - 10 &&
          e.clientY <= rect.bottom + 10 &&
          !zone.classList.contains('correct')
        ) {
          checkAnswer(zone, el);
        }
      });
    });
  }

  function checkAnswer(zone, letterEl) {
    const char = letterEl.dataset.char;
    const target = zone.dataset.target;

    if (char === target) {
      zone.textContent = char;
      zone.classList.add('correct');
      letterEl.style.visibility = 'hidden';
      letterEl.classList.add('used');
      solvedCount++;

      if (solvedCount === 2) {
        playWin();
        document.getElementById('letters-pool').style.display = 'none';
        document.getElementById('message').textContent = `Молодец! Слово: ${cards[currentIndex].word}`;
        const btn = document.getElementById('btn-next');
        btn.textContent = currentIndex < cards.length - 1 ? 'Дальше ➔' : 'Начать сначала ↻';
        document.getElementById('win-box').style.display = 'flex';
      } else {
        playCorrect();
      }
    } else {
      playWrong();
      zone.classList.add('wrong');
      setTimeout(() => zone.classList.remove('wrong'), 400);
    }
  }

  function nextCard() {
    currentIndex = (currentIndex + 1) % cards.length;
    loadCard(currentIndex);
  }

  function prevCard() {
    currentIndex = (currentIndex - 1 + cards.length) % cards.length;
    loadCard(currentIndex);
  }

  loadCard(0);
</script>

</body>
</html>
